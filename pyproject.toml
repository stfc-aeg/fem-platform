[build-system]
requires = ["setuptools>=61", "setuptools_scm[toml]>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "fem"
dynamic = ["version"]
description = "STFC FEM client framework"
requires-python = ">=3.9"
authors = [
    { name = "Tim Nicholls", email = "tim.nicholls@stfc.ac.uk" },
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

[project.urls]
Homepage = "https://github.com/stfc-aeg/fem-platform"

[project.scripts]
fem_shell = "fem.utils.shell:main"
fem_reconfig_ip = "fem.utils.reconfig_ip:main"

[tool.setuptools]
packages = ["fem", "fem.api", "fem.utils"]
zip-safe = false

[tool.setuptools_scm]
